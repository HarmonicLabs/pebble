name: CI

on: push

jobs:
  CI:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: cd packages/pebble && npm i && cd ../pebble-cli && npm i && cd ../..

      - name: Build
        run: cd packages/pebble && npm run build && cd ../pebble-cli && npm run build:no-gen && cd ../..

      - name: Run tests
        run: cd packages/pebble && npm run test && cd ../..

      # `pebble test` on the example projects: exercises the built-in test
      # framework end-to-end (typed fuzzers, `via` fuzzers, CEK execution)
      # against the shipped CLI build. The local compiler build is copied
      # over the CLI's installed dependency so CI always tests THIS commit.
      - name: Run example test suites (pebble test)
        shell: bash
        run: |
          cp -r packages/pebble/dist/* packages/pebble-cli/node_modules/@harmoniclabs/pebble/dist/
          node packages/pebble-cli/dist/index.js test examples/linear-vesting --config examples/linear-vesting/pebble.config.json
          node packages/pebble-cli/dist/index.js test examples/two-party-escrow --config examples/two-party-escrow/pebble.config.json
